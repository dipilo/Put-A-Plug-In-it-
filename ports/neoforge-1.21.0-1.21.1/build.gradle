plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.134'
}

group = 'com.dipilodopilasaurus'
version = "1.21.1-neoforge-1.1.0"
base { archivesName = 'papi' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}
neoForge {
    version = '21.1.129'

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        papi {
            sourceSet(sourceSets.main)
        }
    }
}
repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.129"
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        mod_id: 'papi',
        mod_name: 'Put A Plug In it!',
        mod_authors: 'Dipilodopilasaurus',
        mod_version: project.version,
        mod_description: 'Client leak mitigation for Sophisticated Core ItemStackKey cache.',
        loader_version_range: '[4,)',
        minecraft_version_range: '[1.21,1.21.2)',
        forge_or_neo_version_range: '[21.0.0,21.2.0)'
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'META-INF/mods.toml']) {
        expand replaceProperties
    }
    filesMatching(['pack.mcmeta']) {
        expand([pack_format: 34])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(['MixinConfigs': 'papi.mixins.json'])
    }
}
