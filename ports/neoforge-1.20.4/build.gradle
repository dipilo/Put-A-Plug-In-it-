plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.0.101'
}

group = 'com.dipilodopilasaurus'
version = "1.20.4-neoforge-1.1.0"
base { archivesName = 'papi' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}
runs {
    configureEach {
        modSource project.sourceSets.main
    }
    client {}
    server {
        programArgument '--nogui'
    }
}

def scriptAtFile = layout.buildDirectory.file('neoForge/neoForgeJoined20.4.223/unpacked/ats/_script_neoforge.cfg')
def resourceAtFile = layout.buildDirectory.file('neoForge/neoForgeJoined20.4.223/unpacked/ats/accesstransformer.cfg')

tasks.register('prepareScriptNeoforgeAt') {
    outputs.files(scriptAtFile, resourceAtFile)
    doLast {
        [scriptAtFile.get().asFile, resourceAtFile.get().asFile].each { f ->
            f.parentFile.mkdirs()
            if (!f.exists()) {
                f.text = ''
            }
        }
    }
}

tasks.matching { it.name.startsWith('neoFormForgesAccessTransformerProvider') }.configureEach {
    dependsOn(tasks.named('prepareScriptNeoforgeAt'))
}
repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    implementation "net.neoforged:neoforge:20.4.223"
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        mod_id: 'papi',
        mod_name: 'Put A Plug In it!',
        mod_authors: 'Dipilodopilasaurus',
        mod_version: project.version,
        mod_description: 'Client leak mitigation for Sophisticated Core ItemStackKey cache.',
        loader_version_range: '[2,)',
        minecraft_version_range: '[1.20.4,1.21)',
        forge_or_neo_version_range: '[20.4,)'
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'META-INF/mods.toml']) {
        expand replaceProperties
    }
    filesMatching(['pack.mcmeta']) {
        expand([pack_format: 22])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(['MixinConfigs': 'papi.mixins.json'])
    }
}
