plugins {
    id 'java'
    id 'fabric-loom' version '1.10.+'
}

group = 'com.dipilodopilasaurus'
version = "1.20.4-fabric-1.1.1"
base { archivesName = 'papi' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.4"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.5"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.97.2+1.20.4"
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version
    inputs.property 'loader_version', '0.16.5'
    inputs.property 'fabric_api_version', '0.97.2+1.20.4'
    inputs.property 'minecraft_version', '1.20.4'
    inputs.property 'java_version', '17'

    filesMatching('fabric.mod.json') {
        expand([
            version: project.version,
            loader_version: '0.16.5',
            fabric_api_version: '0.97.2+1.20.4',
            minecraft_version: '1.20.4',
            java_version: '17'
        ])
    }
    filesMatching('pack.mcmeta') {
        expand([pack_format: 22])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}